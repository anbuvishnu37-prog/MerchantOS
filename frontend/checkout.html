<!DOCTYPE html>
<html>
<head>
    <title>MerchantOS Checkout</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body>

    <h1>MerchantOS</h1>

    <h2>Wireless Mouse</h2>
    <p>Price: ₹799</p>

    <button onclick="startPayment()">
        Pay ₹799
    </button>

    <script>
        async function startPayment() {

            // Create a MerchantOS order first
            const orderResponse = await fetch(
                "http://127.0.0.1:8000/orders/",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Idempotency-Key": "frontend-" + Date.now()
                    },
                    body: JSON.stringify({
                        product_id: 2,
                        quantity: 1
                    })
                }
            );

            const orderData = await orderResponse.json();

            if (!orderResponse.ok) {
                alert("Order creation failed");
                console.log(orderData);
                return;
            }

            const merchantOrderId = orderData.order.order_id;

            // Ask MerchantOS to create Razorpay Order
            const paymentResponse = await fetch(
                `http://127.0.0.1:8000/payments/initiate/${merchantOrderId}`,
                {
                    method: "POST"
                }
            );

            const paymentData = await paymentResponse.json();

            if (!paymentResponse.ok) {
                alert("Payment initiation failed");
                console.log(paymentData);
                return;
            }

            const options = {
                key: "rzp_test_TX2BDLVFb4SyOj",

                amount: paymentData.amount,

                currency: paymentData.currency,

                name: "MerchantOS",

                description: "Wireless Mouse",

                order_id: paymentData.razorpay_order_id,

                handler: async function (response) {

                    console.log("Razorpay response:");
                    console.log(response);

                    // Send payment details to MerchantOS
                    const verifyResponse = await fetch(
                        "http://127.0.0.1:8000/payments/verify",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                razorpay_order_id:
                                    response.razorpay_order_id,

                                razorpay_payment_id:
                                    response.razorpay_payment_id,

                                razorpay_signature:
                                    response.razorpay_signature
                            })
                        }
                    );

                    const verifyData = await verifyResponse.json();

                    console.log("Verification response:");
                    console.log(verifyData);

                    if (verifyResponse.ok) {
                        alert("Payment successful and verified!");
                    } else {
                        alert("Payment verification failed!");
                    }
                },

                theme: {
                    color: "#3399cc"
                }
            };

            const razorpay = new Razorpay(options);

            razorpay.open();
        }
    </script>

</body>
</html>
